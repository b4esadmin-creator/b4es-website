name: Ledger - create database (one-off)

# Run once by hand (Actions -> this workflow -> Run workflow). Creates the D1
# database for the ledger app with EU data jurisdiction, which can only be set
# at creation time and is not available through the Cloudflare connector.
# Safe to re-run: it stops if the database already exists.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create b4es-ledger (EU)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if npx wrangler d1 list --json | grep -q '"name": *"b4es-ledger"'; then
            echo "b4es-ledger already exists"; npx wrangler d1 info b4es-ledger
          else
            npx wrangler d1 create b4es-ledger --jurisdiction eu
          fi
