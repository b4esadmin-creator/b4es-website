name: Deploy ledger

on:
  push:
    branches: [main]
    paths:
      - "apps/ledger/**"
      - ".github/workflows/ledger-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ledger
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ledger
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: |
          node --test apps/ledger/test/reports.test.mjs
          bash apps/ledger/test/triggers.sh

      # Until the EU database exists (ledger-db-create.yml) its id is a
      # placeholder; skip rather than fail.
      - name: Check database id
        id: db
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' apps/ledger/wrangler.jsonc; then
            echo "::notice::Ledger database not created yet; deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply database migrations
        if: steps.db.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply b4es-ledger --remote -c apps/ledger/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy ledger Worker
        if: steps.db.outputs.ready == 'true'
        run: npx wrangler deploy -c apps/ledger/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
